aid: splitforms
name: Split Forms
description: Split Forms provides a hosted form backend service that lets developers collect form submissions without building their own server.
  It supports HTML, React, Next.js, and AI‑generated sites, delivering submissions via email and a dashboard. The free tier offers 500 submissions
  with no credit‑card requirement, while paid plans add higher limits, webhooks, file uploads, and team seats.
